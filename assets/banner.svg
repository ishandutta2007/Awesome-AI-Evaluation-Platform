<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>
    
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: url(#textGrad); }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      @keyframes floatParticle1 {
        0% { transform: translate(0, 0); }
        50% { transform: translate(25px, -20px); }
        100% { transform: translate(0, 0); }
      }
      @keyframes floatParticle2 {
        0% { transform: translate(0, 0); }
        50% { transform: translate(-30px, 15px); }
        100% { transform: translate(0, 0); }
      }
      @keyframes waveLine {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 100; }
      }
      
      .grid-bg { animation: pulseGrid 6s ease-in-out infinite; }
      .p1 { animation: floatParticle1 8s ease-in-out infinite; }
      .p2 { animation: floatParticle2 10s ease-in-out infinite; }
      .wave { stroke-dasharray: 10, 10; animation: waveLine 15s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Shapes -->
  <g class="grid-bg">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" stroke="#334155" stroke-width="1" />
    <path d="M200 0 V300 M400 0 V300 M600 0 V300 M800 0 V300 M1000 0 V300" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Dynamic Glowing Orbs / Floating Elements -->
  <g class="p1">
    <circle cx="150" cy="80" r="120" fill="url(#accentGrad)" />
    <circle cx="1020" cy="220" r="90" fill="url(#accentGrad)" />
  </g>
  <g class="p2">
    <circle cx="950" cy="70" r="70" fill="url(#accentGrad)" />
    <circle cx="220" cy="240" r="100" fill="url(#accentGrad)" />
  </g>

  <!-- Wave Lines -->
  <path class="wave" d="M 50,220 Q 300,120 600,220 T 1150,220" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" />
  <path class="wave" d="M 50,80 Q 400,180 800,80 T 1150,150" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />

  <!-- Content Box / Card Accent -->
  <rect x="50" y="40" width="1100" height="220" rx="12" fill="#0f172a" fill-opacity="0.4" stroke="#334155" stroke-width="1" />

  <!-- Badge Pill -->
  <rect x="80" y="65" width="220" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="190" y="86" text-anchor="middle" class="badge">🚀 2026 ECOSYSTEM HUB</text>

  <!-- Title & Subtitle (Foreground Layer) -->
  <text x="80" y="150" class="title">Awesome AI Evaluation Platform</text>
  <text x="80" y="195" class="subtitle">Curated SaaS Platforms, Open-Source Tools, RAG Metrics &amp; LLM-as-a-Judge</text>

  <!-- Accent Nodes -->
  <circle cx="1080" cy="80" r="6" fill="#38bdf8" />
  <circle cx="1110" cy="80" r="4" fill="#818cf8" />
  <circle cx="1080" cy="220" r="5" fill="#c084fc" />
</svg>
